name = "signhub-broker"
main = "src/index.js"
compatibility_date = "2026-11-15"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "signhub-jobs"
database_id = "SET_AFTER_CREATING_D1"

[[r2_buckets]]
binding = "FILES"
bucket_name = "signhub-private-jobs"

[triggers]
crons = ["15 * * * *"]

[vars]
GITHUB_REPOSITORY = "suleyman13900/SignHub"
GITHUB_REF = "refs/heads/main"
GITHUB_APP_ID = "SET_AS_SECRET"
GITHUB_APP_INSTALLATION_ID = "SET_AS_SECRET"
ALLOWED_ORIGIN = "https://suleyman13900.github.io"
