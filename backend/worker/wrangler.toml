name = "signhub-broker"
main = "src/index.js"
compatibility_date = "2026-11-15"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "signhub-jobs"
database_id = "SET_AFTER_CREATING_D1"

[triggers]
crons = ["15 * * * *"]

[vars]
GITHUB_REPOSITORY = "F1tixx/SignHub"
GITHUB_REF = "refs/heads/main"
R2_BUCKET = "signhub-private-jobs"
GITHUB_APP_ID = "SET_ME"
GITHUB_APP_INSTALLATION_ID = "SET_ME"
ALLOWED_ORIGIN = "https://YOUR-SECURE-SITE.example"
