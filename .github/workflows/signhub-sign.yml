name: SignHub secure signing
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque SignHub job identifier
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: signhub-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  sign:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      BROKER_URL: ${{ vars.SIGNHUB_BROKER_URL }}
      JOB_ID: ${{ inputs.job_id }}
      ZSIGN_COMMIT: 9299685bab7ef99827e06e5dfda93af747386590
    steps:
      - name: Claim isolated job
        id: claim
        run: |
          set -euo pipefail
          test -n "$BROKER_URL" || { echo "SIGNHUB_BROKER_URL is not set"; exit 1; }
          TOKEN_JSON=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=signhub-worker")
          OIDC=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")
          echo "::add-mask::$OIDC"
          CLAIM=$(curl -fsS -X POST "$BROKER_URL/internal/claim" \
            -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" \
            --data "$(jq -n --arg id "$JOB_ID" '{job_id:$id}')")
          printf '%s' "$CLAIM" > "$RUNNER_TEMP/signhub-claim.json"
          PASSWORD=$(jq -er '.password | select(type == "string" and length > 0)' "$RUNNER_TEMP/signhub-claim.json")
          echo "::add-mask::$PASSWORD"
          echo "claimed=true" >> "$GITHUB_OUTPUT"

      - name: Download inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signhub"
          python3 - <<'PY'
          import json, os, subprocess
          claim = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "signhub-claim.json")))
          out = os.path.join(os.environ["RUNNER_TEMP"], "signhub")
          for slot, url in claim["inputs"].items():
              subprocess.run(["curl", "--fail", "--location", "--silent", "--show-error", url,
                              "-o", os.path.join(out, slot)], check=True)
          PY

      - name: Build pinned Zsign
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/zsign"
          git -C "$RUNNER_TEMP/zsign" remote add origin https://github.com/zhlynn/zsign.git
          git -C "$RUNNER_TEMP/zsign" fetch --depth 1 origin "$ZSIGN_COMMIT"
          git -C "$RUNNER_TEMP/zsign" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/zsign" -j2
          test -x "$RUNNER_TEMP/zsign/zsign"

      - name: Sign IPA
        id: sign
        run: |
          set -euo pipefail
          CLAIM="$RUNNER_TEMP/signhub-claim.json"
          WORK="$RUNNER_TEMP/signhub"
          PASSWORD=$(jq -er .password "$CLAIM")
          OUT="$WORK/signed.ipa"
          ARGS=(-k "$WORK/p12" -p "$PASSWORD" -m "$WORK/profile" -o "$OUT")
          BUNDLE_ID=$(jq -r '.settings.bundle_id // empty' "$CLAIM")
          APP_NAME=$(jq -r '.settings.bundle_name // empty' "$CLAIM")
          VERSION=$(jq -r '.settings.bundle_version // empty' "$CLAIM")
          [[ -n "$BUNDLE_ID" ]] && ARGS+=(-b "$BUNDLE_ID")
          [[ -n "$APP_NAME" ]] && ARGS+=(-n "$APP_NAME")
          [[ -n "$VERSION" ]] && ARGS+=(-v "$VERSION")
          "$RUNNER_TEMP/zsign/zsign" "${ARGS[@]}" "$WORK/ipa"
          test -s "$OUT"
          echo "signed=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload private result
        id: upload
        if: success()
        env:
          SIGNED_IPA: ${{ steps.sign.outputs.signed }}
        run: |
          set -euo pipefail
          test -s "$SIGNED_IPA"
          RESULT_PUT=$(jq -er .result_put "$RUNNER_TEMP/signhub-claim.json")
          curl --fail --silent --show-error -X PUT \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$SIGNED_IPA" "$RESULT_PUT"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Report job status
        if: always() && steps.claim.outputs.claimed == 'true'
        env:
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          SIGNED_IPA: ${{ steps.sign.outputs.signed }}
        run: |
          set -euo pipefail
          if [[ "$SIGN_OUTCOME" == "success" && "$UPLOAD_OUTCOME" == "success" ]]; then
            STATE=done
            ERROR=null
            APP_INFO=$(python3 - "$SIGNED_IPA" <<'PY' || echo '{}'
          import json, plistlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              path = next(n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist'))
              p = plistlib.loads(z.read(path))
              print(json.dumps({'bundle_id': p.get('CFBundleIdentifier', ''),
                                'bundle_version': p.get('CFBundleVersion', ''),
                                'bundle_name': p.get('CFBundleDisplayName') or p.get('CFBundleName', 'Signed app')}))
          PY
            )
          else
            STATE=failed
            ERROR='"Signing or result upload failed"'
            APP_INFO='{}'
          fi
          TOKEN_JSON=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=signhub-worker")
          OIDC=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")
          BODY=$(jq -n --arg id "$JOB_ID" --arg state "$STATE" --argjson error "$ERROR" --argjson app_info "$APP_INFO" \
            '{job_id:$id,state:$state,error:$error,app_info:$app_info}')
          curl -fsS -X POST "$BROKER_URL/internal/finish" \
            -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data "$BODY"

      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signhub" "$RUNNER_TEMP/zsign" "$RUNNER_TEMP/signhub-claim.json"
