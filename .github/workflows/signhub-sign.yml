name: SignHub secure signing
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Opaque SignHub job identifier
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: signhub-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  sign:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Get runner identity and claim isolated job
        id: claim
        env:
          BROKER_URL: ${{ vars.SIGNHUB_BROKER_URL }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=signhub-worker")
          OIDC=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")
          echo "::add-mask::$OIDC"
          CLAIM=$(curl -fsS -X POST "$BROKER_URL/internal/claim" -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data "$(jq -n --arg id "$JOB_ID" '{job_id:$id}')")
          echo "$CLAIM" > "$RUNNER_TEMP/signhub-claim.json"
          echo "::add-mask::$(jq -r .password "$RUNNER_TEMP/signhub-claim.json")"
      - name: Download inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signhub"
          python3 - <<'PY'
          import json,os,subprocess
          p=os.path.join(os.environ["RUNNER_TEMP"],"signhub-claim.json")
          d=json.load(open(p)); out=os.path.join(os.environ["RUNNER_TEMP"],"signhub")
          for slot,url in d["inputs"].items():
              subprocess.run(["curl","--fail","--location","--silent","--show-error",url,"-o",os.path.join(out,slot)],check=True)
          PY
      - name: Build Zsign
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign"
          cd "$RUNNER_TEMP/zsign"
          make -j2
          echo "$RUNNER_TEMP/zsign" >> "$GITHUB_PATH"
      - name: Sign IPA
        id: sign
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          CLAIM="$RUNNER_TEMP/signhub-claim.json"
          WORK="$RUNNER_TEMP/signhub"
          IPA="$WORK/ipa"
          P12="$WORK/p12"
          PROFILE="$WORK/profile"
          PASSWORD=$(jq -r .password "$CLAIM")
          chmod 600 "$P12" "$PROFILE" "$IPA"
          OUT="$WORK/signed.ipa"
          ARGS=(-k "$P12" -p "$PASSWORD" -m "$PROFILE" -o "$OUT")
          BUNDLE_ID=$(jq -r '.settings.bundle_id // empty' "$CLAIM")
          APP_NAME=$(jq -r '.settings.bundle_name // empty' "$CLAIM")
          VERSION=$(jq -r '.settings.bundle_version // empty' "$CLAIM")
          [[ -n "$BUNDLE_ID" ]] && ARGS+=(-b "$BUNDLE_ID")
          [[ -n "$APP_NAME" ]] && ARGS+=(-n "$APP_NAME")
          [[ -n "$VERSION" ]] && ARGS+=(-v "$VERSION")
          "$RUNNER_TEMP/zsign/zsign" "${ARGS[@]}" "$IPA"
          test -s "$OUT"
          echo "signed=$OUT" >> "$GITHUB_OUTPUT"
      - name: Upload private result
        if: success()
        run: |
          set -euo pipefail
          CLAIM="$RUNNER_TEMP/signhub-claim.json"
          URL=$(jq -r .result_put "$CLAIM")
          curl --fail --silent --show-error -X PUT -H "Content-Type: application/octet-stream" --data-binary @"${{ steps.sign.outputs.signed }}" "$URL"
          MANIFEST="$RUNNER_TEMP/signhub/manifest.plist"
          APP_URL=$(jq -r .result_put "$CLAIM")
          # The final manifest is generated by the broker/result publishing stage after the IPA is stored.
          cat > "$MANIFEST" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict><key>assets</key><array><dict><key>kind</key><string>software-package</string><key>url</key><string>REPLACE_SIGNED_IPA_URL</string></dict></array></dict></array></dict></plist>
          PLIST
          # Manifest URL needs to refer to the private signed IPA URL; generated in the broker finalize endpoint.
      - name: Report job status
        if: always()
        env:
          BROKER_URL: ${{ vars.SIGNHUB_BROKER_URL }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=signhub-worker")
          OIDC=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")
          if [[ "${{ job.status }}" == "success" ]]; then STATE=done; else STATE=failed; fi
          curl -fsS -X POST "$BROKER_URL/internal/finish" -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data "$(jq -n --arg id "$JOB_ID" --arg state "$STATE" '{job_id:$id,state:$state}')"
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/signhub" "$RUNNER_TEMP/zsign" "$RUNNER_TEMP/signhub-claim.json"
