name: Deploy SignHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble site from frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R frontend/. _site/
          cp gate.js icon.png _site/
          cp -R Install _site/Install
          find _site -type f -name '*.html' -print0 | xargs -0 sed -i \
            -e 's#../icon.png#icon.png#g' \
            -e 's#../gate.js#gate.js#g' \
            -e 's#../Install/#Install/#g'
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/gate.js
          test -s _site/style.css
          test -s _site/Install/SignHub_WebApp.mobileconfig
          test -s _site/Install/SignHub_AntiRevoke.mobileconfig

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
