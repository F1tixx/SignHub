name: zsign Linux test

# Manual test only: builds zsign on Ubuntu and, optionally, signs a test IPA.
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Optional: direct URL to a TEST .ipa (leave empty to only build zsign)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional repository secrets, only needed for the signing step.
      P12_B64: ${{ secrets.TEST_P12_BASE64 }}
      PROFILE_B64: ${{ secrets.TEST_PROFILE_BASE64 }}
      P12_PASSWORD: ${{ secrets.TEST_P12_PASSWORD }}
      IPA_URL: ${{ inputs.ipa_url }}

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config libssl-dev libminizip-dev zlib1g-dev unzip curl

      - name: Get zsign source
        run: |
          git clone --depth 1 https://github.com/zhlynn/zsign.git zsign-src
          cd zsign-src
          git log -1 --format='zsign commit: %h %ad'
          echo "--- repo layout ---"
          ls
          ls build 2>/dev/null || true

      - name: Build zsign
        working-directory: zsign-src
        run: |
          if [ -f build/linux/Makefile ]; then
            echo "Using build/linux/Makefile"
            (cd build/linux && make clean || true && make -j"$(nproc)")
          elif [ -f CMakeLists.txt ]; then
            echo "Using CMake"
            cmake -S . -B out -DCMAKE_BUILD_TYPE=Release
            cmake --build out -j"$(nproc)"
          elif [ -f Makefile ]; then
            echo "Using top-level Makefile"
            make -j"$(nproc)"
          else
            echo "No known build method found. Layout:"; find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi

      - name: Locate zsign binary
        run: |
          BIN=$(find zsign-src -type f -name zsign -perm -u+x | head -1)
          if [ -z "$BIN" ]; then echo "zsign binary not found"; find zsign-src -type f -perm -u+x | head -30; exit 1; fi
          echo "Found: $BIN"
          cp "$BIN" "$RUNNER_TEMP/zsign"
          echo "--- zsign usage ---"
          "$RUNNER_TEMP/zsign" 2>&1 | head -40 || true

      - name: Download test IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          curl -fL --max-time 300 -o "$RUNNER_TEMP/input.ipa" "$IPA_URL"
          ls -l "$RUNNER_TEMP/input.ipa"

      - name: Sign test IPA
        if: ${{ inputs.ipa_url != '' }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$PROFILE_B64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "Signing secrets are not set (TEST_P12_BASE64, TEST_PROFILE_BASE64, TEST_P12_PASSWORD). Skipping."
            exit 0
          fi
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          "$RUNNER_TEMP/zsign" \
            -k "$RUNNER_TEMP/cert.p12" \
            -p "$P12_PASSWORD" \
            -m "$RUNNER_TEMP/profile.mobileprovision" \
            -o "$RUNNER_TEMP/signed.ipa" \
            "$RUNNER_TEMP/input.ipa"
          echo "--- result ---"
          ls -l "$RUNNER_TEMP/signed.ipa"
          unzip -l "$RUNNER_TEMP/signed.ipa" | grep -m5 "_CodeSignature" || echo "No _CodeSignature found"

      - name: Remove credentials and files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/input.ipa" "$RUNNER_TEMP/signed.ipa"
